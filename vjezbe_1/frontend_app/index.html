<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konoba RS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Konoba RS</h1>

  <h2>Jelovnik</h2>
  <ul id="jelovnik">
    <li>Učitavanje...</li>
  </ul>

  <h2>Nova narudžba</h2>
  <form id="forma">
    <input id="ime" placeholder="Vaše ime" required>
    <select id="jelo"></select>
    <input id="kolicina" type="number" value="1" min="1">
    <button type="submit">Naruči</button>
  </form>
  <p id="poruka"></p>

  <h2>Narudžbe</h2>
  <ul id="narudzbe"></ul>

  <script src="app.js"></script>
</body>
</html>
